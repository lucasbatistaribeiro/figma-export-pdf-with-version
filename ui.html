<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: var(--figma-color-bg, #fff);
    --text: var(--figma-color-text, #1a1a1a);
    --text-secondary: var(--figma-color-text-secondary, #8c8c8c);
    --border: var(--figma-color-border, #e6e6e6);
    --input-bg: var(--figma-color-bg-secondary, #f5f5f5);
    --hover-bg: var(--figma-color-bg-hover, #f0f0f0);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --brand-text: var(--figma-color-text-onbrand, #fff);
    --danger: var(--figma-color-text-danger, #e03e3e);
    --success: #14ae5c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Inter, -apple-system, system-ui, sans-serif;
    font-size: 12px;
    color: var(--text);
    background: var(--bg);
    padding: 16px;
  }

  .label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .hint {
    color: var(--text-secondary);
    font-weight: 400;
  }

  .field { margin-bottom: 16px; }

  .version-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 10px;
    transition: border-color .15s;
  }
  .version-wrap:focus-within { border-color: var(--brand); }

  .prefix {
    color: var(--text-secondary);
    font-weight: 500;
    user-select: none;
  }

  input[type="text"] {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    padding: 9px 0;
    font-family: inherit;
  }

  select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 9px 10px;
    outline: none;
  }
  select:focus { border-color: var(--brand); }

  .preview {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    font-size: 11px;
    line-height: 1.5;
    word-break: break-all;
  }
  .preview .pname { color: var(--text); font-weight: 500; }
  .preview .suffix { color: var(--brand); font-weight: 600; }
  .preview .row + .row { margin-top: 6px; }
  .preview .more { color: var(--text-secondary); }
  .preview .size { color: var(--text-secondary); font-weight: 400; }

  /* Campo de texto genérico (nome do arquivo) */
  .text-wrap {
    display: flex;
    align-items: center;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 10px;
    transition: border-color .15s;
  }
  .text-wrap:focus-within { border-color: var(--brand); }

  .label-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .restore-link {
    font-weight: 500;
    color: var(--brand);
    cursor: pointer;
    text-decoration: none;
  }
  .restore-link:hover { text-decoration: underline; }

  /* Seletor de modo */
  .modes {
    display: flex;
    gap: 6px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px;
  }
  .modes label {
    flex: 1;
    text-align: center;
    padding: 7px 4px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 500;
    user-select: none;
    line-height: 1.3;
  }
  .modes input { display: none; }
  .modes label.on {
    background: var(--bg);
    color: var(--text);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
  }
  .modes .sub {
    display: block;
    font-size: 10px;
    font-weight: 400;
    color: var(--text-secondary);
  }

  /* Checkbox de layout */
  .check {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .check input { flex: none; margin: 0; cursor: pointer; }
  .check .check-text { font-weight: 600; }
  .check .check-hint { color: var(--text-secondary); font-weight: 400; }

  /* Controles de compressão */
  .sliders {
    margin-top: 10px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .slider-row + .slider-row { margin-top: 8px; }
  .slider-row .sl-label { flex: none; width: 62px; color: var(--text-secondary); }
  .slider-row input[type="range"] { flex: 1; margin: 0; accent-color: var(--brand); }
  .slider-row .sl-value {
    flex: none;
    width: 56px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .note {
    margin-top: 8px;
    font-size: 11px;
    line-height: 1.45;
    color: var(--text-secondary);
  }

  /* Lista de telas selecionadas */
  .list {
    border: 1px solid var(--border);
    border-radius: 6px;
    max-height: 148px;
    overflow-y: auto;
  }
  .list:empty { display: none; }
  .item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
  }
  .item + .item { border-top: 1px solid var(--border); }
  .item .idx {
    flex: none;
    width: 16px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  .item .nm {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item .meta {
    flex: none;
    color: var(--text-secondary);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }
  .item .meta .from { text-decoration: line-through; }
  .item .meta .to { color: var(--success); font-weight: 600; }
  .item .meta .to.grow { color: var(--danger); }
  .item .move {
    flex: none;
    display: flex;
    gap: 2px;
  }
  .item .move button {
    width: 18px;
    height: 18px;
    padding: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--text-secondary);
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
  }
  .item .move button:hover:not(:disabled) { background: var(--hover-bg); color: var(--text); }
  .empty {
    padding: 10px;
    color: var(--text-secondary);
    border: 1px dashed var(--border);
    border-radius: 6px;
  }

  .totals {
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-secondary);
  }
  .totals b { color: var(--text); }
  .totals .to { color: var(--success); }
  .totals .to.grow { color: var(--danger); }

  button {
    width: 100%;
    border: none;
    border-radius: 6px;
    background: var(--brand);
    color: var(--brand-text);
    font-size: 13px;
    font-weight: 600;
    padding: 11px;
    cursor: pointer;
    font-family: inherit;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }

  button.link {
    width: auto;
    padding: 0;
    background: none;
    color: var(--brand);
    font-size: 11px;
    font-weight: 500;
  }
  button.link:hover:not(:disabled) { text-decoration: underline; }

  .msg {
    margin-top: 12px;
    font-size: 11px;
    min-height: 14px;
    color: var(--danger);
  }
  .msg.ok { color: var(--success); }
  .msg.info { color: var(--text-secondary); }

  /* ---------- Estado de exportação: skeleton + botão animado ---------- */

  /* Durante a exportação o formulário inteiro vira blocos cinza pulsantes.
     Cada elemento marcado abaixo mantém a própria altura, então o layout
     não salta ao entrar e sair do estado de carregamento. */
  .loading #form {
    pointer-events: none;
    user-select: none;
  }
  .loading #form .label,
  .loading #form .label-row,
  .loading #form .modes,
  .loading #form .version-wrap,
  .loading #form .text-wrap,
  .loading #form select,
  .loading #form .check,
  .loading #form .sliders,
  .loading #form .note,
  .loading #form .list,
  .loading #form .empty,
  .loading #form .totals,
  .loading #form .preview {
    border-color: transparent !important;
    border-radius: 6px;
    background-color: var(--input-bg);
    background-image: linear-gradient(
      90deg,
      transparent 0%,
      var(--hover-bg) 45%,
      var(--hover-bg) 55%,
      transparent 100%
    );
    background-size: 220% 100%;
    background-repeat: no-repeat;
    animation: skeleton-sweep 1.25s ease-in-out infinite;
    box-shadow: none !important;
  }
  /* esconde o conteúdo sem alterar a caixa */
  .loading #form .label > *,
  .loading #form .label-row > *,
  .loading #form .modes > *,
  .loading #form .version-wrap > *,
  .loading #form .text-wrap > *,
  .loading #form select,
  .loading #form .check > *,
  .loading #form .sliders > *,
  .loading #form .note,
  .loading #form .list > *,
  .loading #form .empty,
  .loading #form .totals,
  .loading #form .preview > * {
    visibility: hidden;
  }
  .loading #form .label,
  .loading #form .note,
  .loading #form .empty,
  .loading #form .totals,
  .loading #form select {
    color: transparent !important;
  }
  /* labels viram barras curtas, como num skeleton de verdade */
  .loading #form .label { max-width: 132px; }
  .loading #form .totals:empty { display: none; }

  @keyframes skeleton-sweep {
    0%   { background-position: 150% 0; }
    100% { background-position: -50% 0; }
  }

  /* Botão: barra de progresso ao fundo + spinner */
  button#export {
    position: relative;
    overflow: hidden;
  }
  .btn-progress {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    background: rgba(255, 255, 255, .25);
    transition: width .3s ease;
    pointer-events: none;
  }
  /* sem total conhecido (montagem/finalização): faixa correndo */
  .btn-progress.indeterminate {
    width: 45%;
    transition: none;
    animation: btn-slide 1.1s ease-in-out infinite;
  }
  @keyframes btn-slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(222%); }
  }

  .btn-content {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
  }

  .spinner {
    display: none;
    flex: none;
    width: 13px;
    height: 13px;
    border: 2px solid rgba(255, 255, 255, .35);
    border-top-color: var(--brand-text);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  .loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* o botão continua legível mesmo desabilitado durante a exportação */
  .loading button#export:disabled { opacity: 1; }

  /* Erro com detalhes */
  .error-box {
    margin-top: 10px;
    border: 1px solid var(--danger);
    border-radius: 6px;
    padding: 10px;
  }
  .error-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .error-title {
    flex: 1;
    font-size: 11px;
    font-weight: 600;
    color: var(--danger);
    line-height: 1.4;
  }
  .error-actions {
    flex: none;
    display: flex;
    gap: 10px;
  }
  .error-details {
    margin: 8px 0 0;
    padding: 8px;
    background: var(--input-bg);
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10px;
    line-height: 1.45;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 132px;
    overflow-y: auto;
  }

  @media (prefers-reduced-motion: reduce) {
    .loading #form .label,
    .loading #form .label-row,
    .loading #form .modes,
    .loading #form .version-wrap,
    .loading #form .text-wrap,
    .loading #form select,
    .loading #form .check,
    .loading #form .sliders,
    .loading #form .note,
    .loading #form .list,
    .loading #form .empty,
    .loading #form .totals,
    .loading #form .preview {
      animation: none;
      background-image: none;
    }
    .btn-progress.indeterminate { animation: none; width: 100%; }
    .spinner { animation-duration: 2s; }
  }
</style>
</head>
<body>
 <!-- tudo aqui dentro vira skeleton durante a exportação -->
 <div id="form">
  <!-- só faz sentido com mais de uma tela selecionada -->
  <div class="field" id="modeField" style="display:none">
    <span class="label">Como exportar</span>
    <div class="modes" id="modes">
      <label id="modeSeparateLabel" class="on">
        <input type="radio" name="mode" value="separate" checked />
        Arquivos separados
        <span class="sub">1 PDF por tela</span>
      </label>
      <label id="modeSingleLabel">
        <input type="radio" name="mode" value="single" />
        PDF único
        <span class="sub">1 página por tela</span>
      </label>
    </div>
  </div>

  <div class="field">
    <label class="label" for="version">
      Versão <span class="hint">— formato 0.0</span>
    </label>
    <div class="version-wrap">
      <span class="prefix">v.</span>
      <input id="version" type="text" inputmode="decimal" placeholder="1.0" value="1.0" />
    </div>
  </div>

  <div class="field">
    <div class="label-row">
      <label class="label" for="fileName" style="margin-bottom:0">Nome do arquivo</label>
      <a class="restore-link" id="restoreName">usar nome do Figma</a>
    </div>
    <div class="text-wrap">
      <input id="fileName" type="text" placeholder="Nome do arquivo" />
    </div>
  </div>

  <div class="field">
    <label class="check">
      <input type="checkbox" id="layout" />
      <span class="check-text">Layout</span>
      <span class="check-hint">— acrescenta (desktop) ou (mobile)</span>
    </label>
  </div>

  <div class="field">
    <label class="label" for="compress">Compressão</label>
    <select id="compress">
      <option value="none" selected>Nenhuma — vetorial, texto selecionável</option>
      <option value="light">Leve — 144 DPI, qualidade 92%</option>
      <option value="medium">Média — 108 DPI, qualidade 82%</option>
      <option value="max">Máxima — 72 DPI, qualidade 65%</option>
      <option value="custom">Personalizada…</option>
    </select>

    <div class="sliders" id="sliders" style="display:none">
      <div class="slider-row">
        <span class="sl-label">Resolução</span>
        <input type="range" id="scale" min="0.5" max="4" step="0.25" value="1.5" />
        <span class="sl-value" id="scaleValue">108 DPI</span>
      </div>
      <div class="slider-row">
        <span class="sl-label">Qualidade</span>
        <input type="range" id="quality" min="30" max="100" step="1" value="82" />
        <span class="sl-value" id="qualityValue">82%</span>
      </div>
    </div>

    <div class="note" id="compressNote"></div>
  </div>

  <div class="field">
    <div class="label-row">
      <span class="label" style="margin-bottom:0">Telas selecionadas <span class="hint" id="selCount">0</span></span>
      <button class="link" id="measure" disabled>calcular tamanhos</button>
    </div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty">Selecione uma ou mais telas no canvas.</div>
    <div class="totals" id="totals"></div>
  </div>

  <div class="field">
    <span class="label">Nome final</span>
    <div class="preview" id="preview">—</div>
  </div>
 </div>

  <button id="export" disabled>
    <span class="btn-progress" id="btnProgress"></span>
    <span class="btn-content">
      <span class="spinner" id="spinner" aria-hidden="true"></span>
      <span id="exportLabel">Exportar PDF</span>
    </span>
  </button>

  <div class="msg" id="msg" role="status"></div>

  <div class="error-box" id="errorBox" style="display:none">
    <div class="error-head">
      <span class="error-title" id="errorTitle"></span>
      <span class="error-actions">
        <button class="link" id="errorToggle">ver detalhes</button>
        <button class="link" id="errorCopy">copiar</button>
      </span>
    </div>
    <pre class="error-details" id="errorDetails" style="display:none"></pre>
  </div>

<script>
  const versionInput = document.getElementById("version");
  const fileNameInput = document.getElementById("fileName");
  const restoreLink = document.getElementById("restoreName");
  const layoutCheckbox = document.getElementById("layout");
  const compressSelect = document.getElementById("compress");
  const slidersEl = document.getElementById("sliders");
  const scaleInput = document.getElementById("scale");
  const qualityInput = document.getElementById("quality");
  const scaleValueEl = document.getElementById("scaleValue");
  const qualityValueEl = document.getElementById("qualityValue");
  const compressNoteEl = document.getElementById("compressNote");
  const previewEl = document.getElementById("preview");
  const exportBtn = document.getElementById("export");
  const measureBtn = document.getElementById("measure");
  const msgEl = document.getElementById("msg");
  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const selCountEl = document.getElementById("selCount");
  const totalsEl = document.getElementById("totals");
  const modeSeparateLabel = document.getElementById("modeSeparateLabel");
  const modeSingleLabel = document.getElementById("modeSingleLabel");
  const modeFieldEl = document.getElementById("modeField");
  const exportLabelEl = document.getElementById("exportLabel");
  const btnProgressEl = document.getElementById("btnProgress");
  const errorBoxEl = document.getElementById("errorBox");
  const errorTitleEl = document.getElementById("errorTitle");
  const errorDetailsEl = document.getElementById("errorDetails");
  const errorToggleEl = document.getElementById("errorToggle");
  const errorCopyEl = document.getElementById("errorCopy");

  // scale = multiplicador de resolução (1 => 72 DPI); quality = 0..1 do JPEG.
  const PRESETS = {
    none: null,
    light: { scale: 2, quality: 0.92 },
    medium: { scale: 1.5, quality: 0.82 },
    max: { scale: 1, quality: 0.65 },
  };

  let docName = "documento";
  let nodes = [];              // telas selecionadas, na ordem de exportação
  let nameInitialized = false;
  let busy = false;            // exportando
  let measuring = false;       // calculando tamanhos

  // Caches de medição. O PDF vetorial de uma tela não depende da compressão,
  // então fica num cache próprio e sobrevive à troca de preset.
  let nativeSizes = {};        // id -> bytes do PDF vetorial
  let compSizes = {};          // id -> bytes do PDF comprimido
  let pages = {};              // id -> { jpeg, pxW, pxH, ptW, ptH }
  let compKey = null;          // assinatura da compressão a que compSizes/pages se referem
  let clampedAny = false;      // alguma tela teve a resolução reduzida

  // Tempo mínimo de animação: sem isso, uma tela pequena faz o skeleton
  // aparecer e desaparecer num piscar, que lê como glitch.
  const MIN_ANIMATION_MS = 450;
  let busyStartedAt = 0;
  let unbusyTimer = null;

  // Com uma tela só os dois modos dão o mesmo arquivo, e "separate" é o
  // caminho mais leve (não cria página temporária). A escolha do usuário fica
  // guardada no radio para quando a seleção voltar a ter várias telas.
  function currentMode() {
    if (nodes.length <= 1) return "separate";
    const checked = document.querySelector('input[name="mode"]:checked');
    return checked ? checked.value : "separate";
  }

  // Configuração de compressão ativa, ou null quando desligada.
  function compression() {
    const v = compressSelect.value;
    if (v === "custom") {
      return {
        scale: parseFloat(scaleInput.value),
        quality: parseInt(qualityInput.value, 10) / 100,
      };
    }
    return PRESETS[v] || null;
  }

  // Assinatura da compressão: só ela afeta os bytes comprimidos de uma tela
  // (nome, versão, modo e ordem não mudam o conteúdo).
  function compressionKey() {
    const c = compression();
    return c ? c.scale + ":" + c.quality : "none";
  }

  // Os tamanhos da configuração atual já estão calculados?
  function hasSizes() {
    if (nodes.length === 0) return false;
    if (!compression()) return nodes.every((n) => nativeSizes[n.id] != null);
    return (
      compKey === compressionKey() &&
      nodes.every((n) => compSizes[n.id] != null)
    );
  }

  // Nome base: o que o usuário digitou, ou o nome do Figma como fallback.
  function currentName() {
    const v = fileNameInput.value.trim();
    return v || docName;
  }

  // Categoria de layout pela largura (>= 400px = desktop).
  function layoutOf(node) {
    if (node.width == null) return null;
    return node.width >= 400 ? "desktop" : "mobile";
  }

  // Sufixo de layout de uma tela específica.
  function layoutSuffix(node) {
    if (!layoutCheckbox.checked) return "";
    const kind = node ? layoutOf(node) : null;
    return kind ? " (" + kind + ")" : " (desktop/mobile)";
  }

  // Sufixo do PDF único: usa a categoria comum ou marca as duas.
  function layoutSuffixCombined() {
    if (!layoutCheckbox.checked) return "";
    if (nodes.length === 0) return " (desktop/mobile)";
    const kinds = [];
    for (const n of nodes) {
      const k = layoutOf(n);
      if (k && kinds.indexOf(k) === -1) kinds.push(k);
    }
    if (kinds.length === 1) return " (" + kinds[0] + ")";
    if (kinds.length === 0) return " (desktop/mobile)";
    return " (desktop+mobile)";
  }

  // ---- Formata a versão para o padrão "0.0" ----
  function normalizeVersion(raw) {
    // mantém só dígitos e ponto
    let v = (raw || "").replace(/[^0-9.]/g, "");
    const n = parseFloat(v);
    if (isNaN(n)) return "1.0";
    return n.toFixed(1); // garante sempre um dígito decimal: 1 -> "1.0"
  }

  function currentVersion() {
    return normalizeVersion(versionInput.value);
  }

  function todayStr() {
    const d = new Date();
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    return `${dd}.${mm}.${d.getFullYear()}`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  // Remove caracteres proibidos em nomes de arquivo.
  function sanitize(s) {
    return String(s)
      .replace(/[\\/:*?"<>|]/g, "-")
      .replace(/\s+/g, " ")
      .replace(/^\.+/, "")
      .trim();
  }

  function formatBytes(n) {
    if (n == null) return "—";
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(0).replace(".", ",") + " KB";
    return (n / (1024 * 1024)).toFixed(1).replace(".", ",") + " MB";
  }

  function tail() {
    return `-${todayStr()}-v.${currentVersion()}.pdf`;
  }

  // Evita dois arquivos com o mesmo nome no mesmo lote.
  function dedupe(names) {
    const seen = {};
    return names.map((name) => {
      if (!seen[name]) {
        seen[name] = 1;
        return name;
      }
      seen[name]++;
      return name.replace(/\.pdf$/i, "") + `-${seen[name]}.pdf`;
    });
  }

  // Lista final de arquivos: [{ id, fileName }]
  function buildItems() {
    if (currentMode() === "single") {
      const name = sanitize(currentName()) + layoutSuffixCombined() + tail();
      return [{ id: nodes.length ? nodes[0].id : null, fileName: name }];
    }

    // Com uma única tela, o nome segue o formato original (sem o nome do frame).
    const withScreenName = nodes.length > 1;
    const names = nodes.map((n) => {
      const base = sanitize(currentName());
      const screen = withScreenName ? "-" + sanitize(n.name) : "";
      return base + screen + layoutSuffix(n) + tail();
    });
    const unique = dedupe(names);
    return nodes.map((n, i) => ({ id: n.id, fileName: unique[i] }));
  }

  // ================= PDF a partir de imagens =================
  // Um PDF mínimo, uma página por imagem, com o JPEG embutido cru
  // (filtro DCTDecode — o formato aceita os bytes do JPEG sem reencodar).
  function buildImagePdf(pageList) {
    const enc = new TextEncoder();
    const chunks = [];
    let len = 0;

    function push(data) {
      const arr = typeof data === "string" ? enc.encode(data) : data;
      chunks.push(arr);
      len += arr.length;
    }
    function fmt(n) {
      return String(Math.round(n * 100) / 100);
    }

    const objCount = 2 + pageList.length * 3;
    const offsets = new Array(objCount + 1).fill(0);

    push("%PDF-1.4\n");
    // comentário binário: marca o arquivo como não-texto
    push(new Uint8Array([0x25, 0xe2, 0xe3, 0xcf, 0xd3, 0x0a]));

    offsets[1] = len;
    push("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");

    const kids = pageList.map((_, i) => `${3 + i * 3} 0 R`).join(" ");
    offsets[2] = len;
    push(
      `2 0 obj\n<< /Type /Pages /Kids [${kids}] /Count ${pageList.length} >>\nendobj\n`
    );

    pageList.forEach((p, i) => {
      const pageNum = 3 + i * 3;
      const contentNum = pageNum + 1;
      const imageNum = pageNum + 2;
      const w = fmt(p.ptW);
      const h = fmt(p.ptH);

      offsets[pageNum] = len;
      push(
        `${pageNum} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] ` +
          `/Resources << /XObject << /Im0 ${imageNum} 0 R >> >> ` +
          `/Contents ${contentNum} 0 R >>\nendobj\n`
      );

      // desenha a imagem ocupando a página inteira
      const content = enc.encode(`q\n${w} 0 0 ${h} 0 0 cm\n/Im0 Do\nQ\n`);
      offsets[contentNum] = len;
      push(`${contentNum} 0 obj\n<< /Length ${content.length} >>\nstream\n`);
      push(content);
      push("endstream\nendobj\n");

      offsets[imageNum] = len;
      push(
        `${imageNum} 0 obj\n<< /Type /XObject /Subtype /Image ` +
          `/Width ${p.pxW} /Height ${p.pxH} /ColorSpace /DeviceRGB ` +
          `/BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpeg.length} >>\nstream\n`
      );
      push(p.jpeg);
      push("\nendstream\nendobj\n");
    });

    const xrefOffset = len;
    // cada entrada da xref tem exatamente 20 bytes
    let xref = `xref\n0 ${objCount + 1}\n0000000000 65535 f \n`;
    for (let i = 1; i <= objCount; i++) {
      xref += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
    }
    push(xref);
    push(
      `trailer\n<< /Size ${objCount + 1} /Root 1 0 R >>\n` +
        `startxref\n${xrefOffset}\n%%EOF\n`
    );

    return { chunks, size: len };
  }

  // PNG (bytes do Figma) -> JPEG comprimido, sobre fundo branco.
  async function toJpeg(pngBytes, quality) {
    const blob = new Blob([pngBytes], { type: "image/png" });
    const bitmap = await createImageBitmap(blob);
    const canvas = document.createElement("canvas");
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;

    const ctx = canvas.getContext("2d");
    // JPEG não tem transparência: achata sobre branco
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bitmap, 0, 0);
    if (bitmap.close) bitmap.close();

    const out = await new Promise((resolve, reject) => {
      canvas.toBlob(
        (b) => (b ? resolve(b) : reject(new Error("falha ao gerar JPEG"))),
        "image/jpeg",
        quality
      );
    });
    const buf = await out.arrayBuffer();
    return { jpeg: new Uint8Array(buf), pxW: canvas.width, pxH: canvas.height };
  }

  // ================= Interface =================

  // Pinta um nome de arquivo destacando o sufixo de layout.
  function renderName(name) {
    const m = name.match(
      /^(.*?)( \((?:desktop|mobile|desktop\/mobile|desktop\+mobile)\))(.*)$/
    );
    if (!m) return '<span class="pname">' + escapeHtml(name) + "</span>";
    return (
      '<span class="pname">' + escapeHtml(m[1]) + "</span>" +
      '<span class="suffix">' + escapeHtml(m[2]) + "</span>" +
      '<span class="pname">' + escapeHtml(m[3]) + "</span>"
    );
  }

  // No PDF único sem compressão o tamanho real só é conhecido depois de
  // exportar (o Figma compartilha fontes entre as páginas), então a soma dos
  // PDFs individuais é uma estimativa.
  function sizesAreApprox() {
    return currentMode() === "single" && !compression();
  }

  // Montar o PDF único custa concatenar todos os JPEGs: guarda o resultado.
  let singleTotalCache = { key: null, size: null };

  function singleCompressedTotal() {
    const key = compressionKey() + "|" + nodes.map((n) => n.id).join(",");
    if (singleTotalCache.key === key) return singleTotalCache.size;
    if (!nodes.length || !nodes.every((n) => pages[n.id])) return null;
    const size = buildImagePdf(nodes.map((n) => pages[n.id])).size;
    singleTotalCache = { key, size };
    return size;
  }

  // Tamanho final de cada arquivo, quando já calculado.
  function fileSizes() {
    if (!hasSizes()) return null;
    const c = compression();
    const store = c ? compSizes : nativeSizes;

    if (currentMode() === "single") {
      // com compressão o total exato vem do arquivo montado
      if (c) {
        const exact = singleCompressedTotal();
        return exact == null ? null : [exact];
      }
      let total = 0;
      for (const n of nodes) {
        if (store[n.id] == null) return null;
        total += store[n.id];
      }
      return [total];
    }

    const out = [];
    for (const n of nodes) {
      if (store[n.id] == null) return null;
      out.push(store[n.id]);
    }
    return out;
  }

  function updatePreview() {
    if (nodes.length === 0) {
      const name =
        sanitize(currentName()) +
        (layoutCheckbox.checked ? " (desktop/mobile)" : "") +
        tail();
      previewEl.innerHTML = '<div class="row">' + renderName(name) + "</div>";
      return;
    }

    const items = buildItems();
    const finalSizes = fileSizes();
    const shown = items.slice(0, 3);

    const approx = sizesAreApprox() ? "≈ " : "";
    let html = shown
      .map((it, i) => {
        const size =
          finalSizes && finalSizes[i] != null
            ? ' <span class="size">— ' + approx + formatBytes(finalSizes[i]) + "</span>"
            : "";
        return '<div class="row">' + renderName(it.fileName) + size + "</div>";
      })
      .join("");

    if (items.length > shown.length) {
      html +=
        '<div class="row more">+ ' +
        (items.length - shown.length) +
        " arquivo(s)</div>";
    }
    if (currentMode() === "single") {
      html +=
        '<div class="row more">' + nodes.length + " página(s) em um único PDF</div>";
    }
    previewEl.innerHTML = html;
  }

  // ---- Animação de exportação ----

  function setExportLabel(text) {
    exportLabelEl.textContent = text;
  }

  // Faixa correndo, para as etapas sem total conhecido.
  function setIndeterminate() {
    btnProgressEl.style.width = "";
    btnProgressEl.classList.add("indeterminate");
  }

  function setProgress(done, total) {
    if (!total || total <= 0 || done >= total) {
      // terminou de contar, mas o Figma/PDF ainda está trabalhando
      setIndeterminate();
      return;
    }
    btnProgressEl.classList.remove("indeterminate");
    btnProgressEl.style.width = Math.max(0, Math.min(100, (done / total) * 100)) + "%";
  }

  // Barra cheia no encerramento, antes de sair do estado de exportação.
  function setProgressFull() {
    btnProgressEl.classList.remove("indeterminate");
    btnProgressEl.style.width = "100%";
  }

  // Liga/desliga o skeleton do formulário e a animação do botão.
  function setBusy(on) {
    if (unbusyTimer) {
      clearTimeout(unbusyTimer);
      unbusyTimer = null;
    }

    if (on) {
      busy = true;
      busyStartedAt = Date.now();
      document.body.classList.add("loading");
      setIndeterminate();
      updateButton();
      return;
    }

    // segura a animação até o tempo mínimo, para não piscar
    const elapsed = Date.now() - busyStartedAt;
    const rest = Math.max(0, MIN_ANIMATION_MS - elapsed);

    const stop = () => {
      unbusyTimer = null;
      busy = false;
      document.body.classList.remove("loading");
      btnProgressEl.classList.remove("indeterminate");
      btnProgressEl.style.width = "";
      refresh();
    };

    if (rest === 0) stop();
    else unbusyTimer = setTimeout(stop, rest);
  }

  // Junta contexto + mensagem + stack num bloco copiável.
  function errorDetails(e, context) {
    const lines = (context || []).slice();
    if (e && e.message) lines.push("Mensagem: " + e.message);
    if (e && e.stack) lines.push("", String(e.stack));
    else if (e && !e.message) lines.push("Erro: " + String(e));
    return lines.join("\n");
  }

  function clearError() {
    errorBoxEl.style.display = "none";
    errorDetailsEl.style.display = "none";
    errorDetailsEl.textContent = "";
    errorToggleEl.textContent = "ver detalhes";
  }

  function showError(message, details) {
    msgEl.textContent = "";
    msgEl.className = "msg";
    errorTitleEl.textContent = message || "Erro na exportação.";
    errorDetailsEl.textContent = details || "Sem detalhes adicionais.";
    errorDetailsEl.style.display = "none";
    errorToggleEl.textContent = "ver detalhes";
    errorBoxEl.style.display = "block";
  }

  errorToggleEl.addEventListener("click", () => {
    const open = errorDetailsEl.style.display !== "none";
    errorDetailsEl.style.display = open ? "none" : "block";
    errorToggleEl.textContent = open ? "ver detalhes" : "ocultar detalhes";
  });

  errorCopyEl.addEventListener("click", async () => {
    const text = errorTitleEl.textContent + "\n\n" + errorDetailsEl.textContent;
    try {
      await navigator.clipboard.writeText(text);
      errorCopyEl.textContent = "copiado";
    } catch (e) {
      // clipboard bloqueado no iframe: mostra os detalhes para copiar à mão
      errorDetailsEl.style.display = "block";
      errorToggleEl.textContent = "ocultar detalhes";
      errorCopyEl.textContent = "selecione e copie";
    }
    setTimeout(() => (errorCopyEl.textContent = "copiar"), 2000);
  });

  function updateCompressUI() {
    const isCustom = compressSelect.value === "custom";
    slidersEl.style.display = isCustom ? "block" : "none";

    const c = compression();
    if (isCustom) {
      scaleValueEl.textContent = Math.round(72 * parseFloat(scaleInput.value)) + " DPI";
      qualityValueEl.textContent = qualityInput.value + "%";
    }

    if (!c) {
      compressNoteEl.textContent =
        "PDF vetorial gerado pelo Figma: texto selecionável e melhor qualidade, arquivo maior.";
    } else {
      compressNoteEl.textContent =
        "As telas são rasterizadas em JPEG a " +
        Math.round(72 * c.scale) +
        " DPI. O arquivo fica bem menor, mas o texto deixa de ser selecionável.";
    }
  }

  function updateButton() {
    const n = nodes.length;
    exportBtn.disabled = busy || measuring || n === 0;
    measureBtn.disabled = busy || measuring || n === 0;

    if (!measuring) {
      measureBtn.textContent = hasSizes() ? "recalcular" : "calcular tamanhos";
    }

    if (busy) return; // o texto durante a exportação é controlado pelo progresso
    if (n === 0) {
      setExportLabel("Exportar PDF");
    } else if (currentMode() === "single") {
      setExportLabel(n === 1 ? "Exportar PDF" : `Exportar PDF único (${n} páginas)`);
    } else {
      setExportLabel(n === 1 ? "Exportar PDF" : `Exportar ${n} PDFs`);
    }
  }

  function move(index, delta) {
    const target = index + delta;
    if (target < 0 || target >= nodes.length) return;
    const tmp = nodes[index];
    nodes[index] = nodes[target];
    nodes[target] = tmp;
    // a ordem não muda os bytes de cada tela, só a ordem das páginas
    refresh();
  }

  function renderList() {
    selCountEl.textContent = nodes.length === 0 ? "0" : "— " + nodes.length + " tela(s)";
    emptyEl.style.display = nodes.length === 0 ? "block" : "none";
    listEl.innerHTML = "";

    const reorderable = currentMode() === "single" && nodes.length > 1;
    const compressed = !!compression();
    const showComp = compressed && compKey === compressionKey();

    nodes.forEach((n, i) => {
      const row = document.createElement("div");
      row.className = "item";

      const idx = document.createElement("span");
      idx.className = "idx";
      idx.textContent = i + 1;

      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = n.name;
      nm.title = n.name;

      const meta = document.createElement("span");
      meta.className = "meta";
      const native = nativeSizes[n.id];
      const comp = showComp ? compSizes[n.id] : null;

      if (comp != null && native != null) {
        const grow = comp > native;
        meta.innerHTML =
          '<span class="from">' + formatBytes(native) + "</span> " +
          '<span class="to' + (grow ? " grow" : "") + '">' +
          formatBytes(comp) + "</span>";
      } else if (comp != null) {
        meta.innerHTML = '<span class="to">' + formatBytes(comp) + "</span>";
      } else if (native != null && !compressed) {
        meta.innerHTML = '<span class="to">' + formatBytes(native) + "</span>";
      } else if (native != null) {
        meta.innerHTML = '<span class="from">' + formatBytes(native) + "</span>";
      } else {
        meta.textContent =
          n.width != null && n.height != null ? n.width + "×" + n.height : "";
      }

      row.appendChild(idx);
      row.appendChild(nm);
      row.appendChild(meta);

      if (reorderable) {
        const moveWrap = document.createElement("span");
        moveWrap.className = "move";

        const up = document.createElement("button");
        up.textContent = "▲";
        up.title = "Mover para cima";
        up.disabled = i === 0;
        up.addEventListener("click", () => move(i, -1));

        const down = document.createElement("button");
        down.textContent = "▼";
        down.title = "Mover para baixo";
        down.disabled = i === nodes.length - 1;
        down.addEventListener("click", () => move(i, 1));

        moveWrap.appendChild(up);
        moveWrap.appendChild(down);
        row.appendChild(moveWrap);
      }

      listEl.appendChild(row);
    });
  }

  function renderTotals() {
    const finalSizes = fileSizes();
    if (!finalSizes || nodes.length === 0) {
      totalsEl.innerHTML = "";
      return;
    }

    const compressed = !!compression();
    const approx = sizesAreApprox() ? "≈ " : "";
    const total = finalSizes.reduce((a, b) => a + b, 0);
    let html = "Total: <b>" + approx + formatBytes(total) + "</b>";

    if (compressed) {
      let native = 0;
      let ok = true;
      for (const n of nodes) {
        if (nativeSizes[n.id] == null) { ok = false; break; }
        native += nativeSizes[n.id];
      }
      if (ok && native > 0) {
        const diff = Math.round((1 - total / native) * 100);
        const grow = diff < 0;
        html =
          "Total: " + formatBytes(native) + " → " +
          '<b class="to' + (grow ? " grow" : "") + '">' + formatBytes(total) + "</b> " +
          "(" + (grow ? "+" + -diff : "−" + diff) + "%)";
      }
    }

    if (clampedAny) {
      html += '<br />Alguma tela é grande demais para a resolução escolhida e foi reduzida.';
    }

    totalsEl.innerHTML = html;
  }

  function refresh() {
    modeFieldEl.style.display = nodes.length > 1 ? "block" : "none";
    renderList();
    renderTotals();
    updatePreview();
    updateButton();
  }

  // A seleção mudou: nada do que foi medido serve.
  function invalidateAll() {
    nativeSizes = {};
    compSizes = {};
    pages = {};
    compKey = null;
    clampedAny = false;
    singleTotalCache = { key: null, size: null };
  }

  // Só a compressão mudou: os PDFs vetoriais medidos continuam valendo.
  function invalidateCompression() {
    compSizes = {};
    pages = {};
    compKey = null;
    clampedAny = false;
    singleTotalCache = { key: null, size: null };
  }

  // ---- Fila de downloads ----
  // O navegador pode ignorar vários downloads disparados ao mesmo tempo,
  // então cada arquivo é salvo com um pequeno intervalo.
  const queue = [];
  let draining = false;
  let pendingFinish = null;

  function sleep(ms) {
    return new Promise((r) => setTimeout(r, ms));
  }

  function saveFile(item) {
    const blob = new Blob(item.parts, { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = item.fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  async function drain() {
    if (draining) return;
    draining = true;
    while (queue.length) {
      const item = queue.shift();
      saveFile(item);
      if (queue.length) await sleep(350);
    }
    draining = false;
    flushFinish();
  }

  function enqueue(parts, fileName) {
    queue.push({ parts, fileName });
    drain();
  }

  function flushFinish() {
    if (!pendingFinish || draining || queue.length) return;
    const info = pendingFinish;
    pendingFinish = null;

    setProgressFull();

    if (info.mode === "single") {
      msgEl.textContent = `PDF exportado com ${info.total} página(s).`;
    } else {
      msgEl.textContent =
        info.total === 1 ? "PDF exportado." : `${info.total} PDFs exportados.`;
    }
    msgEl.className = "msg ok";
    setBusy(false); // já chama refresh() ao encerrar a animação
  }

  // ---- Eventos da interface ----
  fileNameInput.addEventListener("input", updatePreview);

  restoreLink.addEventListener("click", () => {
    fileNameInput.value = docName;
    updatePreview();
  });

  layoutCheckbox.addEventListener("change", updatePreview);

  compressSelect.addEventListener("change", () => {
    if (compressSelect.value === "custom") {
      // parte dos valores do preset médio
      scaleInput.value = String(PRESETS.medium.scale);
      qualityInput.value = String(Math.round(PRESETS.medium.quality * 100));
    }
    if (compKey !== compressionKey()) invalidateCompression();
    updateCompressUI();
    refresh();
  });

  [scaleInput, qualityInput].forEach((el) => {
    el.addEventListener("input", () => {
      if (compKey !== compressionKey()) invalidateCompression();
      updateCompressUI();
      refresh();
    });
  });

  document.querySelectorAll('input[name="mode"]').forEach((radio) => {
    radio.addEventListener("change", () => {
      modeSeparateLabel.classList.toggle("on", currentMode() === "separate");
      modeSingleLabel.classList.toggle("on", currentMode() === "single");
      refresh();
    });
  });

  // Enquanto digita: limpa caracteres inválidos
  versionInput.addEventListener("input", () => {
    versionInput.value = versionInput.value.replace(/[^0-9.]/g, "");
    updatePreview();
  });

  // Ao sair do campo: normaliza para 0.0
  versionInput.addEventListener("blur", () => {
    versionInput.value = currentVersion();
    updatePreview();
  });

  measureBtn.addEventListener("click", () => {
    if (measuring || busy || nodes.length === 0) return;

    const c = compression();
    // só pede ao Figma o que ainda não está em cache
    const needNative = nodes.some((n) => nativeSizes[n.id] == null);
    const needRaster = !!c && !nodes.every((n) => pages[n.id] && compKey === compressionKey());

    if (!needNative && !needRaster) {
      if (c) compKey = compressionKey();
      refresh();
      return;
    }
    if (needRaster) invalidateCompression();

    measuring = true;
    pendingCompKey = compressionKey();
    measureBtn.textContent = "calculando…";
    msgEl.textContent = "";
    msgEl.className = "msg";
    updateButton();

    parent.postMessage(
      {
        pluginMessage: {
          type: "measure",
          ids: nodes.map((n) => n.id),
          scale: needRaster ? c.scale : null,
          native: needNative,
        },
      },
      "*"
    );
  });

  exportBtn.addEventListener("click", () => {
    if (busy || measuring || nodes.length === 0) return;

    versionInput.value = currentVersion();
    const c = compression();
    const items = buildItems();

    msgEl.textContent = "";
    msgEl.className = "msg";
    clearError();

    exportItems = items;
    exportMode = currentMode();

    // entra no estado animado: formulário em skeleton, botão com spinner
    setBusy(true);
    setExportLabel("Exportando…");

    // Se os tamanhos já foram calculados com estas configurações, os bitmaps
    // estão em cache: monta o PDF direto, sem rasterizar de novo.
    if (c && compKey === compressionKey() && nodes.every((n) => pages[n.id])) {
      finishCompressedExport();
      return;
    }

    parent.postMessage(
      {
        pluginMessage: {
          type: "export",
          mode: exportMode,
          version: currentVersion(),
          fileName: items[0].fileName,
          scale: c ? c.scale : null,
          items:
            exportMode === "single"
              ? nodes.map((n) => ({ id: n.id }))
              : items,
        },
      },
      "*"
    );
  });

  // ---- Rasterização: fila sequencial para preservar a ordem ----
  let chain = Promise.resolve();
  let pendingCompKey = null; // assinatura de compressão sendo medida
  let exportItems = [];      // nomes de arquivo do export em andamento
  let exportMode = "separate";

  // Erro: cancela a animação na hora (sem esperar o tempo mínimo) e mostra a
  // mensagem com os detalhes técnicos recolhidos.
  function fail(message, details) {
    if (unbusyTimer) {
      clearTimeout(unbusyTimer);
      unbusyTimer = null;
    }
    busy = false;
    measuring = false;
    pendingFinish = null;
    queue.length = 0;

    document.body.classList.remove("loading");
    btnProgressEl.classList.remove("indeterminate");
    btnProgressEl.style.width = "";

    showError(message, details);
    refresh();
  }

  async function handleRaster(msg) {
    if (msg.nativeSize != null) nativeSizes[msg.id] = msg.nativeSize;
    if (msg.clamped) clampedAny = true;

    if (msg.bytes) {
      const c = compression();
      const img = await toJpeg(msg.bytes, c ? c.quality : 0.82);
      pages[msg.id] = {
        jpeg: img.jpeg,
        pxW: img.pxW,
        pxH: img.pxH,
        ptW: msg.ptW,
        ptH: msg.ptH,
      };
      // tamanho exato do PDF de uma página só
      compSizes[msg.id] = buildImagePdf([pages[msg.id]]).size;
    }

    if (msg.purpose === "measure") {
      measureBtn.textContent = `calculando ${msg.index}/${msg.total}…`;
    }
  }

  function finishCompressedExport() {
    const list = nodes.map((n) => pages[n.id]).filter(Boolean);
    if (list.length === 0) {
      fail("Não foi possível gerar as imagens das telas.");
      return;
    }

    if (exportMode === "single") {
      const pdf = buildImagePdf(list);
      enqueue(pdf.chunks, exportItems[0].fileName);
      pendingFinish = { mode: "single", total: list.length };
    } else {
      const byId = {};
      exportItems.forEach((it) => (byId[it.id] = it.fileName));
      let count = 0;
      for (const n of nodes) {
        const page = pages[n.id];
        if (!page) continue;
        const pdf = buildImagePdf([page]);
        enqueue(pdf.chunks, byId[n.id] || sanitize(n.name) + ".pdf");
        count++;
      }
      pendingFinish = { mode: "separate", total: count };
    }

    // os tamanhos agora são conhecidos; guarda para a prévia
    compKey = compressionKey();
    flushFinish();
  }

  // ---- Mensagens vindas do code.js ----
  onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === "info") {
      docName = msg.docName || "documento";

      // Mantém a ordem escolhida pelo usuário se a seleção não mudou.
      const incoming = msg.nodes || [];
      const sameSet =
        incoming.length === nodes.length &&
        incoming.every((n) => nodes.some((old) => old.id === n.id));

      if (sameSet) {
        // atualiza nome/tamanho preservando a ordem atual
        nodes = nodes.map((old) => incoming.find((n) => n.id === old.id) || old);
      } else {
        nodes = incoming.slice();
        invalidateAll();
      }

      // Preenche o campo de nome com o nome do Figma na primeira carga,
      // sem sobrescrever uma edição já feita pelo usuário.
      if (!nameInitialized) {
        fileNameInput.value = docName;
        nameInitialized = true;
      }

      if (msg.selectionCount > 0 && nodes.length === 0) {
        msgEl.textContent = "A seleção atual não pode ser exportada em PDF.";
        msgEl.className = "msg";
      }

      refresh();
    }

    if (msg.type === "progress") {
      if (msg.purpose === "measure") {
        if (measuring) {
          measureBtn.textContent = `calculando ${msg.done + 1}/${msg.total}…`;
        }
        return;
      }
      if (!busy) return;
      const label = msg.label ? " — " + msg.label : "";
      setExportLabel(
        msg.total > 1
          ? `Exportando ${msg.done}/${msg.total}${label}`
          : "Exportando…"
      );
      setProgress(msg.done, msg.total);
    }

    if (msg.type === "raster") {
      chain = chain
        .then(() => handleRaster(msg))
        .catch((e) =>
          fail(
            "Erro ao processar a imagem de “" + msg.name + "”.",
            errorDetails(e, [
              "Tela: " + msg.name + " (" + msg.id + ")",
              "Bitmap: " + msg.ptW + "×" + msg.ptH + " pt, escala " + msg.scale,
              "Etapa: " + (msg.purpose === "measure" ? "cálculo de tamanho" : "exportação"),
            ])
          )
        );
    }

    if (msg.type === "rasterDone") {
      chain = chain.then(() => {
        if (msg.purpose === "measure") {
          measuring = false;
          compKey = pendingCompKey;
          refresh();
        } else {
          try {
            finishCompressedExport();
          } catch (e) {
            fail(
              "Erro ao montar o PDF.",
              errorDetails(e, ["Telas: " + nodes.length, "Modo: " + exportMode])
            );
          }
        }
      });
    }

    // PDF pronto vindo do code.js (caminho sem compressão)
    if (msg.type === "download") {
      enqueue([msg.bytes], msg.fileName);
    }

    if (msg.type === "finished") {
      pendingFinish = { mode: msg.mode, total: msg.total };
      flushFinish();
    }

    if (msg.type === "error") {
      fail(msg.message, msg.details);
    }
  };

  updateCompressUI();

  // Pede o estado inicial
  parent.postMessage({ pluginMessage: { type: "init" } }, "*");
</script>
</body>
</html>
